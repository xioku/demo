<!DOCTYPE html>
<html>
    <head>
        <meta charset=utf-8 />
        <title>时钟</title>
        <style type="text/css">
            /* cyrillic-ext */
            @font-face {
                font-family: 'PT Mono';
                font-style: normal;
                font-weight: 400;
                src: local('PT Mono'), local('PTMono-Regular'), url(9oRONYoBnWILk-9AnCIzM-Py.woff2) format('woff2');
                unicode-range: U+0460-052F, U+1C80-1C88, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
            }

            /* cyrillic */
            @font-face {
                font-family: 'PT Mono';
                font-style: normal;
                font-weight: 400;
                src: local('PT Mono'), local('PTMono-Regular'), url(9oRONYoBnWILk-9AnCszM-Py.woff2) format('woff2');
                unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
            }

            /* latin-ext */
            @font-face {
                font-family: 'PT Mono';
                font-style: normal;
                font-weight: 400;
                src: local('PT Mono'), local('PTMono-Regular'), url(9oRONYoBnWILk-9AnCEzM-Py.woff2) format('woff2');
                unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }

            /* latin */
            @font-face {
                font-family: 'PT Mono';
                font-style: normal;
                font-weight: 400;
                src: local('PT Mono'), local('PTMono-Regular'), url(9oRONYoBnWILk-9AnC8zMw.woff2) format('woff2');
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }

            body,
            html {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                background-color: #ECECEC;
            }

            .clock {
                list-style: none;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: relative;
            }

            .clock li {
                display: block;
                height: 10px;
                width: 10000px;
                position: absolute;
                top: calc(50% - 5px);
                left: calc(50% - 5000px);
                box-sizing: border-box;
                border-width: 1px 0;
                border-style: solid;
            }

            .clock li:after {
                content: "";
                position: absolute;
                top: -1px;
                left: 50%;
                height: 10px;
            }

            .clock .hours {
                border-color: #eb472a;
            }

            .clock .hours:after {
                width: 150px;
                background-color: #eb472a;
            }

            .clock .minutes {
                border-color: #4ba6af;
            }

            .clock .minutes:after {
                width: 200px;
                background-color: #4ba6af;
            }

            .clock .seconds {
                height: 5px;
                border-color: #727f80;
                top: calc(50% - 5px/2);
            }

            .clock .seconds:before {
                content: "";
                position: absolute;
                width: 25px;
                height: 25px;
                top: -10px;
                left: calc(50% - 10px);
                background-color: #727f80;
                border-radius: 5px;
                z-index: 3;
            }

            .clock .seconds:after {
                height: 5px;
                width: 250px;
                background-color: #727f80;
            }

            .time {
                position: absolute;
                height: 100%;
                width: 100%;
                top: 0;
                left: 0;
                font-size: 64px;
                color: #a6a8a8;
                display: flex;
                align-items: flex-end;
                justify-content: flex-end;
                z-index: 0;
                font-family: 'PT Mono', sans-serif;
            }

            @media only screen and (min-device-width: 320px) and (max-device-width: 568px) and (orientation: portrait) {
                .time {
                    font-size: 200px;
                }
            }

            @media only screen and (min-device-width: 320px) and (max-device-width: 568px) and (orientation: landscape) {
                .time {
                    font-size: 200px;
                }
            }
        </style>
    </head>
    <body>
        <div class="time"></div>
        <ul class="clock">
            <li class='hours dial'></li>
            <li class='minutes dial'></li>
            <li class='seconds dial'></li>
        </ul>
        <script type="text/javascript">
            ;
            (function() {
                "use strict";

                function update() {
                    window.requestAnimationFrame(update);
                    var now = new Date();
                    var time = {
                        "hours": 360 * (now.getHours() % 12 + now.getMinutes() / 60) / 12 - 90,
                        "minutes": 360 * (now.getMinutes() + now.getSeconds() / 60) / 60 - 90,
                        "seconds": 360 * (now.getSeconds() + now.getMilliseconds() / 1000) / 60 - 90,
                    };
                    for (var i in time) {
                        document.querySelector("." + i).style.webkitTransform = "rotate(" + time[i] + "deg)";
                        document.querySelector("." + i).style.transform = "rotate(" + time[i] + "deg)";
                    }
                    if (now.toTimeString) {
                        document.querySelector(".time").innerText = now.toTimeString().split(" ")[0];
                    } else {
                        document.querySelector(".time").innerText = now.toString();
                    }
                }
                window.requestAnimationFrame(update);
            })();
        </script>
    </body>
</html>
